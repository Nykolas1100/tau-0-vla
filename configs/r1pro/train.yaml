# =============================================================================
# Training config for BEHAVIOR 2026 - R1Pro Robot.
#
# This file must stay beside its data.py. train.py imports <yaml_dir>/data.py to
# register config_name and to derive state_dim / action_dim / action_horizon; move
# them apart and the run aborts at startup, naming both places it searched.
#
# Values without a placeholder are the shipped defaults and work as they stand.
# =============================================================================

experiment:
  run_name: behavior_2026_r1pro_finetune
  project_name: tau-0-vla
  notes: "Finetuning tau0-vla for the BEHAVIOR 2026 challenge using the R1Pro robot."

model_args:
  # The checkpoint to warm-start from. Overridable on the command line.
  model_name_or_path: checkpoints/tau0-vla-base
  vlm_model_type: qwen3.5
  vla_model_type: tau0_vla
  # Which stacks receive gradients. All four on is full finetuning.
  tune_mm_vision: true
  tune_mm_mlp: true
  tune_mm_llm: true
  tune_vla_dit: true
  loss_type: fm
  num_steps: 10
  vlm_causal: true
  tau_vla_prefix_flash_backend: true
  vla_inactive_input_zero: true

data_args:
  # Must equal the @register_config function name in data.py.
  config_name: behavior_r1pro
  max_images_per_sample: 15
  vla_max_token_len: 2048
  # 50176 = 224². Raise it together with ResizeWithPad in data.py, or
  # smart_resize scales the image back down.
  max_pixels: 50176
  min_pixels: 3136
  video_max_frames: 12
  video_min_frames: 2
  video_max_pixels: 50176
  video_min_pixels: 3136
  video_fps: 2
  # Same camera names as the Image(...) entries in data.py.
  camera_keys:
    - head
    - wrist
  # How each camera is announced in the prompt. cam_view_names supplies the
  # human-readable half.
  cam_view_template: "{} view: <image>"
  cam_view_names:
    head: "Head"
    wrist: "Wrist"

training_args:
  output_dir: outputs/
  max_steps: 50000
  # Per GPU. Global batch is this times the GPU count. 32 is what the worked
  # example trains at; lower it if your GPUs have less memory than an H200.
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  model_max_length: 2048
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  attn_implementation: sdpa
  # Explicit so run_spec.json records them. train.py mirrors seed into data_seed.
  seed: 42
  data_seed: 42
  logging_steps: 10
  enable_step_profiling: false
  step_profiling_cuda_sync: false
  step_profiling_all_ranks_csv: false
  vlm_first_batch_pad_to_max: true
  save_steps: 10000
  dataloader_num_workers: 8
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  report_to: tensorboard
  ddp_find_unused_parameters: true
  ddp_timeout: 7200
  deepspeed: scripts/deepspeed/zero1.json